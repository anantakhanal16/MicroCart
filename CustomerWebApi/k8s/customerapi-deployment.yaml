apiVersion: apps/v1
kind: Deployment
metadata:
  name: customerwebapi
  labels:
    app: customerwebapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customerwebapi
  template:
    metadata:
      labels:
        app: customerwebapi
    spec:
      containers:
        - name: customerwebapi
          image: ark160/customerwebapi:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: DB_HOST
              value: "customerdb"
            - name: DB_NAME
              value: "CustomerDb"
            - name: DB_SA_PASSWORD
              value: "yourStrong(!)Password"

            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_USER
              value: "guest"
            - name: RABBITMQ_PASSWORD
              value: "guest"

            - name: RABBITMQ_EXCHANGE
              value: "order.exchange"
            - name: RABBITMQ_ROUTINGKEY
              value: "order.created"